name: AI Office Suite — D0/D1 Baseline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (licenses, typecheck, build, D1 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check dependency license compliance
        run: npm run lint:licenses

      - name: Typecheck
        run: npm run typecheck

      - name: Build API and Web
        run: npm run build

      - name: Run D1 feasibility & vertical-slice tests
        run: npm test

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
