services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aios_suite}
    volumes:
      - aios_pg16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aios} -d ${POSTGRES_DB:-aios_suite}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aios_internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_MODE: jwt-pg
      HOST: 0.0.0.0
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aios_suite}
      JWT_SECRET: ${JWT_SECRET:?Set a strong >=32-char JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
      AUTO_MIGRATE_ON_START: ${AUTO_MIGRATE_ON_START:-true}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-15000}
      ALLOW_LIVE_SPEECH_PROVIDERS: "false"
      ALLOW_LIVE_AI_PROVIDERS: "false"
    networks:
      - aios_internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks:
      - aios_internal

volumes:
  aios_pg16_data:

networks:
  aios_internal:
    driver: bridge
